<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合成大红霞</title>
<meta name="theme-color" content="#3a1a3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg1: #5e2b5e;
    --bg2: #3a1a3a;
    --panel: #ffffff;
    --accent: #ff5e62;
    --ink: #2b2b3a;
    --muted: #8a8aa0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .panel {
    background: var(--panel);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-width: 100%;
    max-height: 100%;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    gap: 8px;
  }
  .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .scores { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .score-box { text-align: right; }
  .score-box .label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .score-box .value { font-size: 18px; font-weight: 700; color: var(--accent); }
  .next-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 58px;
  }
  .next-box .label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .next-preview {
    margin-top: 2px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .next-preview img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: block; }
  .next-preview .next-num {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
  }
  .progression {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 8px 16px;
    background: #fafaff;
    border-bottom: 1px solid #eee;
    overflow: hidden;
  }
  .progression .pf-item {
    width: var(--pf, 24px);
    height: var(--pf, 24px);
    border-radius: 50%;
    object-fit: cover;
    flex: 0 0 auto;
    display: block;
  }
  .progression .pf-num {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: calc(var(--pf, 24px) * 0.5);
  }
  .progression .pf-arrow {
    color: #b9b9cc;
    font-size: calc(var(--pf, 24px) * 0.5);
    line-height: 1;
    margin: 0 3px;
    flex: 0 0 auto;
  }
  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4fa;
  }
  canvas { display: block; touch-action: none; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(20,20,40,.6);
    color: #fff;
    backdrop-filter: blur(2px);
    text-align: center;
    padding: 20px;
    transition: opacity .2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0 0 6px; font-size: 26px; }
  .overlay p { margin: 4px 0; font-size: 15px; opacity: .9; }
  .overlay .final-score { font-size: 40px; font-weight: 800; margin: 8px 0; }
  .btn {
    margin-top: 16px;
    padding: 12px 34px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff8a5c, #ff5e62);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255,94,98,.45);
  }
  .btn:active { transform: scale(.96); }
  .hint { font-size: 12px; color: rgba(255,255,255,.75); text-align: center; }
  .title { cursor: pointer; }
  .title:active { opacity: .7; }
  .name-input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid #e4e4ec;
    border-radius: 10px;
    font-size: 15px;
    background: #fafaff;
    color: var(--ink);
  }
  .submit-area {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 6px 0 2px;
    max-width: 340px;
    width: 100%;
  }
  .submit-area .btn { margin-top: 0; flex: 0 0 auto; padding: 11px 20px; font-size: 14px; }
  .submit-msg { margin: 4px 0 0; font-size: 12px; min-height: 16px; color: #b6e3a8; }
  .btn-ghost { background: rgba(255,255,255,.18); box-shadow: none; }
  .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.5);
    z-index: 20;
    padding: 16px;
  }
  .modal.hidden { display: none; }
  .modal-card {
    background: #fff;
    color: var(--ink);
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 700;
    border-bottom: 1px solid #eee;
  }
  .modal-close {
    border: none;
    background: #f2f2f7;
    color: #555;
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 15px;
  }
  .lb-list { overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid #f5f5f7;
  }
  .lb-row.me { background: #fff4f4; }
  .lb-rank {
    width: 26px; height: 26px;
    flex: 0 0 26px;
    border-radius: 50%;
    background: #ececf3;
    color: #666;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .lb-rank.top1 { background: #ffd76a; color: #7a4a00; }
  .lb-rank.top2 { background: #d6deea; color: #345; }
  .lb-rank.top3 { background: #f0cba8; color: #6b3d13; }
  .lb-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { font-weight: 700; color: var(--accent); font-size: 15px; }
  .lb-empty { padding: 26px 16px; text-align: center; color: #999; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="panel">
    <header>
      <div class="title" id="lbBtn" role="button" tabindex="0" title="查看排行榜">🌸 合成大红霞</div>
      <div class="scores">
        <div class="next-box">
          <span class="label">下一个</span>
          <div id="nextPreview" class="next-preview"></div>
        </div>
        <div class="score-box">
          <div class="label">得分</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">最高</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>
    <div class="progression" id="progression"></div>
    <div class="stage">
      <canvas id="game"></canvas>
      <div class="overlay hidden" id="overlay">
        <h2>游戏结束</h2>
        <div class="final-score" id="finalScore">0</div>
        <p id="bestLine">最高分 0</p>
        <div class="submit-area">
          <input id="nameInput" class="name-input" maxlength="12" placeholder="输入昵称，参与排行榜" autocomplete="off">
          <button class="btn btn-ghost" id="submitBtn">提交到排行榜</button>
        </div>
        <p class="submit-msg" id="submitMsg"></p>
        <button class="btn" id="restartBtn">重新开始</button>
      </div>
    </div>
  </div>
  <div class="hint">点击/触摸屏幕投放照片，相同的照片合成更大的一张，来合成大红霞吧！</div>
</div>

<div class="modal hidden" id="lbModal">
  <div class="modal-card">
    <div class="modal-head">
      <span>🏆 排行榜</span>
      <button class="modal-close" id="lbClose" aria-label="关闭">✕</button>
    </div>
    <div class="lb-list" id="lbList"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
   * 排行榜配置（GitHub Gist 全网共享）
   * 只改下面两行即可接入你的榜单，改完保存并上线：
   *   LB_GIST_ID —— 你 Gist 的 ID（网址 api.github.com/gists/<ID> 里的那串）
   *   LB_TOKEN   —— 你的 GitHub 经典 Token，仅勾选 gist 权限
   * 留空时排行榜默认不显示/不可用（游戏其余功能不受影响）。
   * ============================================================ */
  const LB_GIST_ID = "99b5f6e6d0b68909b03d5e5cb2b58c49";
  const LB_TOKEN   = "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";
  const LB_FILENAME = "scores.json";

  /* ============================================================
   * 照片层级数据 —— 11 级，由小到大合成，最终合成「大红霞」
   * `image` 由 loadFruitImages 自动填充（assets/fruit_00.jpg ...）。
   * r 为碰撞半径（px），score 为合成该级时获得的分数。
   * ============================================================ */
  const FRUITS = [
    { r: 18,  score: 1 },
    { r: 26,  score: 2 },
    { r: 35,  score: 4 },
    { r: 45,  score: 8 },
    { r: 56,  score: 16 },
    { r: 67,  score: 32 },
    { r: 79,  score: 64 },
    { r: 91,  score: 128 },
    { r: 104, score: 256 },
    { r: 117, score: 512 },
    { r: 132, score: 1024 },
  ];
  const TOP_TIER = FRUITS.length - 1; // 最高级不再合成

  // 逻辑画布尺寸
  const W = 400;
  const H = 620;

  // 物理参数
  const G = 2000;          // 重力加速度 (px/s^2)
  const WALL_E = 0.3;      // 墙壁弹性
  const FRUIT_E = 0.25;    // 水果碰撞弹性
  const FLOOR_FRICTION = 0.9;
  const STEP_DT = 1 / 120; // 物理子步长
  const MAX_SPEED = 2200;
  const SLEEP_SPEED = 6;   // 低于该速度视为静止
  const DANGER_Y = 40;     // 危险线：果实顶边越过此线并持续停留则判负

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const nextPreviewEl = document.getElementById("nextPreview");
  const progressionEl = document.getElementById("progression");
  const overlay = document.getElementById("overlay");
  const finalScoreEl = document.getElementById("finalScore");
  const bestLineEl = document.getElementById("bestLine");
  const restartBtn = document.getElementById("restartBtn");
  const lbBtn = document.getElementById("lbBtn");
  const lbModal = document.getElementById("lbModal");
  const lbClose = document.getElementById("lbClose");
  const lbListEl = document.getElementById("lbList");
  const nameInputEl = document.getElementById("nameInput");
  const submitBtn = document.getElementById("submitBtn");
  const submitMsgEl = document.getElementById("submitMsg");

  let fruits = [];        // 在场果实
  let pendingNew = [];    // 合成产生的新果实（下一轮并入）
  let particles = [];     // 合成粒子特效
  let score = 0;
  let best = 0;
  let nextTier = 0;
  let nextNextTier = 0;
  let pointerX = W / 2;
  let gameOver = false;
  let acc = 0;
  let lastTime = performance.now();

  try { best = parseInt(localStorage.getItem("hongxia_best") || "0", 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ---------- 照片素材 ---------- */
  const IMG_DIR = "assets";
  function fruitImageUrl(tier) {
    return IMG_DIR + "/fruit_" + String(tier).padStart(2, "0") + ".jpg";
  }
  function loadFruitImages(onReady) {
    let remaining = FRUITS.length;
    function done() { remaining -= 1; if (remaining <= 0 && onReady) onReady(); }
    FRUITS.forEach((data, tier) => {
      const img = new Image();
      img.onload = () => { done(); };
      img.onerror = () => { done(); };
      img.src = fruitImageUrl(tier);
      data.image = img;
    });
  }

  /* 层级色 —— 用于加载失败时显示编号占位圆 */
  function tierColor(tier) {
    const hue = (tier * 33 + 330) % 360;
    return hue;
  }

  function updateNextPreview() {
    const data = FRUITS[nextNextTier];
    const img = data.image;
    if (img && img.complete && img.naturalWidth > 0) {
      nextPreviewEl.innerHTML = '<img src="' + img.src + '" alt="">';
    } else {
      const hue = tierColor(nextNextTier);
      nextPreviewEl.innerHTML = '<span class="next-num" style="background:hsl(' + hue + ',65%,55%)">' + (nextNextTier + 1) + "</span>";
    }
  }

  function buildProgression() {
    let html = "";
    FRUITS.forEach((data, i) => {
      const img = data.image;
      const ready = img && img.complete && img.naturalWidth > 0;
      if (ready) {
        html += '<img class="pf-item" src="' + img.src + '" alt="">';
      } else {
        const hue = tierColor(i);
        html += '<span class="pf-item pf-num" style="background:hsl(' + hue + ',65%,55%)">' + (i + 1) + "</span>";
      }
      if (i < FRUITS.length - 1) html += '<span class="pf-arrow">→</span>';
    });
    progressionEl.innerHTML = html;
  }

  function sizeProgression(panelWidth) {
    const n = FRUITS.length;
    const denom = n + 0.6 * (n - 1);
    let item = Math.floor((panelWidth - 64) / denom);
    item = Math.max(14, Math.min(32, item));
    progressionEl.style.setProperty("--pf", item + "px");
  }

  /* 随机选择下一个层级的照片 */
  function randomTier() {
    let maxOnBoard = 0;
    for (const f of fruits) if (f.tier > maxOnBoard) maxOnBoard = f.tier;
    // 最高允许生成到 4 级，并随场上最高级逐步放开
    const cap = Math.min(4, maxOnBoard);
    return Math.floor(Math.random() * (cap + 1));
  }

  function spawnFruit(tier, x, y, vx, vy) {
    return {
      tier, x, y, vx: vx || 0, vy: vy || 0,
      r: FRUITS[tier].r,
      dead: false,
      above: 0,
    };
  }

  function drop(x) {
    if (gameOver) return;
    const tier = nextTier;
    const r = FRUITS[tier].r;
    const jitter = (Math.random() - 0.5) * 40;
    const fx = clamp(x + jitter, r + 2, W - r - 2);
    fruits.push(spawnFruit(tier, fx, r + 2, 0, 60));
    nextTier = nextNextTier;
    nextNextTier = randomTier();
    updateNextPreview();
  }

  function merge(a, b) {
    a.dead = true;
    b.dead = true;
    const tier = a.tier + 1;
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    const nf = spawnFruit(tier, mx, my, (a.vx + b.vx) / 2, -140);
    pendingNew.push(nf);
    score += FRUITS[a.tier].score;
    spawnMergeEffect(mx, my, tier);
  }

  function spawnMergeEffect(x, y, tier) {
    const color = ["#ffd166", "#ff8a5c", "#ff5e62", "#c7f464"][tier % 4];
    for (let i = 0; i < 10; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      particles.push({
        x, y,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp - 60,
        life: 1,
        r: 2 + Math.random() * 4,
        color,
      });
    }
  }

  function resolveWall(f) {
    if (f.x - f.r < 0) { f.x = f.r; f.vx = Math.abs(f.vx) * WALL_E; }
    else if (f.x + f.r > W) { f.x = W - f.r; f.vx = -Math.abs(f.vx) * WALL_E; }
    if (f.y + f.r > H) {
      f.y = H - f.r;
      f.vy = -Math.abs(f.vy) * WALL_E;
      f.vx *= FLOOR_FRICTION;
    }
    if (f.y - f.r < -80) { f.y = -80 + f.r; f.vy = Math.abs(f.vy) * 0.2; }
  }

  function resolveCollision(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    let d = Math.hypot(dx, dy);
    const md = a.r + b.r;
    if (d >= md) return;
    let nx, ny;
    if (d < 1e-4) {
      const ang = Math.random() * Math.PI * 2;
      nx = Math.cos(ang); ny = Math.sin(ang); d = 1e-4;
    } else {
      nx = dx / d; ny = dy / d;
    }
    const ma = a.r * a.r, mb = b.r * b.r;
    const total = ma + mb;
    const overlap = md - d;
    a.x -= nx * overlap * (mb / total);
    a.y -= ny * overlap * (mb / total);
    b.x += nx * overlap * (ma / total);
    b.y += ny * overlap * (ma / total);
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const invSum = 1 / ma + 1 / mb;
      const j = -(1 + FRUIT_E) * vn / invSum;
      a.vx -= j * nx / ma; a.vy -= j * ny / ma;
      b.vx += j * nx / mb; b.vy += j * ny / mb;
    }
  }

  function physicsStep(dt) {
    for (const f of fruits) {
      f.vy += G * dt;
      f.vy = clamp(f.vy, -MAX_SPEED, MAX_SPEED);
      f.vx = clamp(f.vx, -MAX_SPEED, MAX_SPEED);
      f.x += f.vx * dt;
      f.y += f.vy * dt;
    }
    for (const f of fruits) resolveWall(f);

    for (let pass = 0; pass < 10; pass++) {
      let merged = false;
      const n = fruits.length;
      for (let i = 0; i < n; i++) {
        const a = fruits[i];
        if (a.dead) continue;
        for (let j = i + 1; j < n; j++) {
          const b = fruits[j];
          if (b.dead) continue;
          if (a.tier !== b.tier || a.tier >= TOP_TIER) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const d2 = dx * dx + dy * dy;
          const md = (a.r + b.r) + 0.5;
          if (d2 < md * md) {
            merge(a, b);
            merged = true;
          }
        }
      }
      if (merged) {
        fruits = fruits.filter(f => !f.dead);
        fruits.push(...pendingNew);
        pendingNew = [];
        continue;
      }
      for (let iter = 0; iter < 3; iter++) {
        for (let i = 0; i < fruits.length; i++) {
          const a = fruits[i];
          for (let j = i + 1; j < fruits.length; j++) {
            resolveCollision(a, fruits[j]);
          }
        }
      }
      break;
    }

    for (const f of fruits) resolveWall(f);

    for (const f of fruits) {
      const sp = Math.hypot(f.vx, f.vy);
      if (sp < SLEEP_SPEED) { f.vx = 0; f.vy = 0; }
    }
  }

  function drawFruitIcon(x, y, r, tier, alpha) {
    const data = FRUITS[tier];
    const img = data.image;
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
    } else {
      const hue = tierColor(tier);
      const grd = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
      grd.addColorStop(0, "hsl(" + hue + ",70%,74%)");
      grd.addColorStop(1, "hsl(" + hue + ",70%,52%)");
      ctx.fillStyle = grd;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.floor(r * 0.9) + 'px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(tier + 1), x, y + r * 0.05);
    }
    ctx.restore();
  }

  function drawFruit(f) {
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(f.x + 3, f.y + f.r * 0.75, f.r * 0.85, f.r * 0.26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawFruitIcon(f.x, f.y, f.r, f.tier, null);

    // 白色细描边，让圆形照片更分明
    ctx.save();
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#fdf7fb");
    bg.addColorStop(1, "#efe7f2");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.strokeStyle = "rgba(255,94,98,.5)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, DANGER_Y);
    ctx.lineTo(W, DANGER_Y);
    ctx.stroke();
    ctx.restore();

    for (const f of fruits) drawFruit(f);
    drawParticles();

    if (!gameOver && pointerX !== null) {
      const r = FRUITS[nextTier].r;
      const gx = clamp(pointerX, r + 2, W - r - 2);
      drawFruitIcon(gx, r + 4, r, nextTier, 0.4);
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 400 * dt;
      p.life -= dt * 2.2;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function updateGameOver(dt) {
    if (gameOver) return;
    for (const f of fruits) {
      if (f.y - f.r < DANGER_Y) {
        f.above += dt;
        if (f.above > 1.5) { doGameOver(); return; }
      } else {
        f.above = 0;
      }
    }
  }

  function doGameOver() {
    gameOver = true;
    if (score > best) {
      best = score;
      try { localStorage.setItem("hongxia_best", String(best)); } catch (e) {}
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = score;
    bestLineEl.textContent = "最高分 " + best;
    nameInputEl.value = getPlayerName();
    submitMsgEl.textContent = "";
    submitBtn.disabled = false;
    submitBtn.textContent = "提交到排行榜";
    if (!lbReady()) {
      submitBtn.disabled = true;
      submitBtn.textContent = "未配置排行榜";
      submitMsgEl.textContent = "";
    }
    overlay.classList.remove("hidden");
  }

  function restart() {
    fruits = [];
    pendingNew = [];
    particles = [];
    score = 0;
    scoreEl.textContent = "0";
    nextTier = randomTier();
    nextNextTier = randomTier();
    updateNextPreview();
    gameOver = false;
    acc = 0;
    overlay.classList.add("hidden");
  }

  /* ---------- 排行榜（GitHub Gist 后端）---------- */
  function lbReady() { return !!(LB_GIST_ID && LB_TOKEN); }
  const LB_MAX = 50;
  const LB_SHOW = 20;
  const LB_MAX_SCORE = 30000;
  let lbCache = { t: 0, data: null };

  function getPlayerId() {
    let id = "";
    try { id = localStorage.getItem("hongxia_pid") || ""; } catch (e) {}
    if (!id) {
      id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem("hongxia_pid", id); } catch (e) {}
    }
    return id;
  }
  function getPlayerName() {
    try { return localStorage.getItem("hongxia_name") || ""; } catch (e) { return ""; }
  }
  function setPlayerName(n) {
    try { localStorage.setItem("hongxia_name", n); } catch (e) {}
  }

  function escapeHtml(s) {
    const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    let out = "";
    for (const ch of String(s)) out += map[ch] || ch;
    return out;
  }

  function lbCleanName(name) {
    const s = String(name == null ? "" : name).trim();
    if (!s) return null;
    if (Array.from(s).length > 12) return null;
    for (const ch of s) {
      const c = ch.codePointAt(0);
      if (c < 32 || c === 127) return null;
    }
    return s;
  }

  function lbNormalize(list) {
    const map = new Map();
    for (const e of (list || [])) {
      if (!e || typeof e.score !== "number" || !isFinite(e.score)) continue;
      const sc = Math.floor(e.score);
      if (sc < 1 || sc > LB_MAX_SCORE) continue;
      const name = lbCleanName(e.name);
      if (!name) continue;
      const id = e.id || ("n:" + name + ":" + (e.t || ""));
      const cur = map.get(id);
      if (!cur || sc > cur.score) map.set(id, { id: id, name: name, score: sc, t: e.t || 0 });
    }
    return Array.from(map.values()).sort(function (a, b) { return b.score - a.score; });
  }

  async function lbFetch() {
    const now = Date.now();
    if (lbCache.data && now - lbCache.t < 8000) return lbCache.data;
    const resp = await fetch("https://api.github.com/gists/" + LB_GIST_ID + "?t=" + now, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    const file = data && data.files && data.files[LB_FILENAME];
    if (!file) throw new Error("未找到 " + LB_FILENAME);
    let arr;
    try { arr = JSON.parse(file.content || "[]"); } catch (e) { throw new Error("数据格式错误"); }
    if (!Array.isArray(arr)) arr = [];
    lbCache = { t: now, data: arr };
    return arr;
  }

  async function lbWrite(arr) {
    const resp = await fetch("https://api.github.com/gists/" + LB_GIST_ID, {
      method: "PATCH",
      headers: {
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
        "Authorization": "token " + LB_TOKEN
      },
      body: JSON.stringify({ files: { [LB_FILENAME]: { content: JSON.stringify(arr) } } })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    lbCache = { t: 0, data: null };
  }

  async function lbSubmit(name, score) {
    const id = getPlayerId();
    const entry = { id: id, name: name, score: score, t: Date.now() };
    let list;
    try { list = await lbFetch(); }
    catch (e) { throw new Error("读取排行榜失败，已取消提交"); }

    const top = lbNormalize(list.concat([entry])).slice(0, LB_MAX);
    try { await lbWrite(top); }
    catch (e) { throw new Error("写入失败，请检查网络或 Token 是否有效"); }
    return top;
  }

  function renderLeaderboard(list) {
    if (!list.length) {
      lbListEl.innerHTML = '<div class="lb-empty">还没有人上榜，快来当第一个吧～</div>';
      return;
    }
    const myId = getPlayerId();
    let html = "";
    list.slice(0, LB_SHOW).forEach(function (e, i) {
      const rank = i + 1;
      const rankCls = "lb-rank" + (rank <= 3 ? " top" + rank : "");
      const meCls = (e.id === myId) ? " me" : "";
      html += '<div class="lb-row' + meCls + '">'
        + '<span class="' + rankCls + '">' + rank + "</span>"
        + '<span class="lb-name">' + escapeHtml(e.name) + "</span>"
        + '<span class="lb-score">' + e.score + "</span>"
        + "</div>";
    });
    lbListEl.innerHTML = html;
  }

  function openLeaderboard() {
    if (!lbReady()) {
      lbListEl.innerHTML = '<div class="lb-empty">排行榜尚未配置<br>请在 index.html 顶部填写 LB_GIST_ID 和 LB_TOKEN</div>';
      lbModal.classList.remove("hidden");
      return;
    }
    lbModal.classList.remove("hidden");
    lbListEl.innerHTML = '<div class="lb-empty">加载中…</div>';
    lbFetch().then(function (list) {
      renderLeaderboard(lbNormalize(list));
    }).catch(function (e) {
      lbListEl.innerHTML = '<div class="lb-empty">加载失败：' + escapeHtml((e && e.message) || "网络错误") + "</div>";
    });
  }

  lbBtn.addEventListener("click", function (e) { e.stopPropagation(); openLeaderboard(); });
  lbClose.addEventListener("click", function () { lbModal.classList.add("hidden"); });
  lbModal.addEventListener("click", function (e) { if (e.target === lbModal) lbModal.classList.add("hidden"); });

  submitBtn.addEventListener("click", function () {
    if (!lbReady()) { submitMsgEl.textContent = "请先配置排行榜"; return; }
    const name = (nameInputEl.value || "").trim().slice(0, 12);
    if (!name) { submitMsgEl.textContent = "请先输入昵称"; return; }
    if (score <= 0) { submitMsgEl.textContent = "分数为 0，先去玩一局吧"; return; }
    setPlayerName(name);
    submitBtn.disabled = true;
    submitMsgEl.textContent = "提交中…";
    lbSubmit(name, score).then(function () {
      submitBtn.textContent = "已提交";
      submitMsgEl.textContent = "✅ 已提交到排行榜";
    }).catch(function (err) {
      submitBtn.disabled = false;
      submitMsgEl.textContent = (err && err.message) ? err.message : "提交失败，请稍后重试";
    });
  });

  function loop(t) {
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    if (dt > 0.05) dt = 0.05;

    if (!gameOver) {
      acc += dt;
      while (acc >= STEP_DT) {
        physicsStep(STEP_DT);
        acc -= STEP_DT;
      }
      updateGameOver(dt);
    }
    updateParticles(dt);

    scoreEl.textContent = score;
    render();
    requestAnimationFrame(loop);
  }

  function getLogicalX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return clamp((clientX - rect.left) / rect.width * W, FRUITS[0].r + 2, W - FRUITS[0].r - 2);
  }

  canvas.addEventListener("pointermove", (e) => {
    pointerX = getLogicalX(e.clientX);
  });
  canvas.addEventListener("pointerdown", (e) => {
    pointerX = getLogicalX(e.clientX);
    drop(pointerX);
  });

  restartBtn.addEventListener("click", restart);
  restartBtn.addEventListener("pointerdown", (e) => e.stopPropagation());

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const appEl = document.getElementById("app");
    const panel = document.querySelector(".panel");
    const headerH = document.querySelector("header").offsetHeight;
    const hintH = document.querySelector(".hint").offsetHeight;

    const cs = getComputedStyle(appEl);
    const padL = parseFloat(cs.paddingLeft) || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const padT = parseFloat(cs.paddingTop) || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    const gap = parseFloat(cs.rowGap) || 12;

    const availW = appEl.clientWidth - padL - padR;
    sizeProgression(availW);
    const progH = progressionEl.offsetHeight;

    const availH = appEl.clientHeight - padT - padB - hintH - gap - headerH - progH;
    const scale = Math.max(0.3, Math.min(availW / W, availH / H, 1.6));
    const dispW = Math.floor(W * scale);
    const dispH = Math.floor(H * scale);

    canvas.style.width = dispW + "px";
    canvas.style.height = dispH + "px";
    panel.style.width = dispW + "px";
    sizeProgression(dispW);

    const k = scale * dpr;
    canvas.width = Math.round(W * k);
    canvas.height = Math.round(H * k);
    ctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
  }
  window.addEventListener("load", function () { resize(); setTimeout(resize, 300); });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { resize(); });
  }

  restart();
  buildProgression();
  resize();
  loadFruitImages(function () { updateNextPreview(); buildProgression(); });
  requestAnimationFrame(loop);
})();
</script>
